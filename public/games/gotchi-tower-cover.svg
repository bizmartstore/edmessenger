<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1B3A"/>
      <stop offset="0.45" stop-color="#1E3A6E"/>
      <stop offset="1" stop-color="#C45C26"/>
    </linearGradient>
    <linearGradient id="tower" x1="320" y1="40" x2="480" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5D76E"/>
      <stop offset="0.5" stop-color="#E8A838"/>
      <stop offset="1" stop-color="#8B4518"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="120" r="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE08A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE08A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="420" fill="url(#sky)"/>
  <circle cx="400" cy="120" r="160" fill="url(#glow)"/>
  <!-- stars -->
  <circle cx="80" cy="60" r="2" fill="#fff" fill-opacity="0.7"/>
  <circle cx="140" cy="100" r="1.5" fill="#fff" fill-opacity="0.5"/>
  <circle cx="700" cy="50" r="2" fill="#fff" fill-opacity="0.8"/>
  <circle cx="740" cy="110" r="1.5" fill="#fff" fill-opacity="0.5"/>
  <circle cx="620" cy="80" r="2" fill="#FDE68A" fill-opacity="0.7"/>
  <!-- floating islands -->
  <ellipse cx="120" cy="280" rx="70" ry="18" fill="#1a3a50" fill-opacity="0.5"/>
  <ellipse cx="680" cy="250" rx="60" ry="14" fill="#1a3a50" fill-opacity="0.45"/>
  <!-- tower body -->
  <path d="M360 380 L360 120 L400 70 L440 120 L440 380 Z" fill="url(#tower)"/>
  <rect x="375" y="140" width="50" height="28" rx="4" fill="#1E3A6E" fill-opacity="0.85"/>
  <rect x="375" y="190" width="50" height="28" rx="4" fill="#1E3A6E" fill-opacity="0.75"/>
  <rect x="375" y="240" width="50" height="28" rx="4" fill="#1E3A6E" fill-opacity="0.7"/>
  <rect x="375" y="290" width="50" height="28" rx="4" fill="#1E3A6E" fill-opacity="0.65"/>
  <!-- portal glow -->
  <ellipse cx="400" cy="154" rx="14" ry="10" fill="#7DD3FC" fill-opacity="0.9"/>
  <ellipse cx="400" cy="204" rx="14" ry="10" fill="#C4B5FD" fill-opacity="0.85"/>
  <ellipse cx="400" cy="254" rx="14" ry="10" fill="#6EE7B7" fill-opacity="0.85"/>
  <!-- gotchi silhouette -->
  <g transform="translate(520 240)">
    <rect x="0" y="0" width="28" height="28" rx="6" fill="#FBBF24"/>
    <rect x="28" y="0" width="28" height="28" rx="6" fill="#F59E0B"/>
    <rect x="-14" y="28" width="28" height="28" rx="6" fill="#6366F1"/>
    <rect x="14" y="28" width="28" height="28" rx="6" fill="#A78BFA"/>
    <rect x="42" y="28" width="28" height="28" rx="6" fill="#6366F1"/>
    <rect x="0" y="56" width="28" height="28" rx="6" fill="#F8FAFC"/>
    <rect x="28" y="56" width="28" height="28" rx="6" fill="#F8FAFC"/>
  </g>
  <!-- particles -->
  <circle cx="300" cy="160" r="4" fill="#FDE68A"/>
  <circle cx="480" cy="130" r="3" fill="#C4B5FD"/>
  <circle cx="340" cy="100" r="3" fill="#7DD3FC"/>
  <text x="36" y="380" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">Gotchi Tower</text>
</svg>
